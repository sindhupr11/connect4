<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four AI | Minimax Challenge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <div class="title-row">
                <h1><span class="text-red">CONNECT</span> <span class="text-yellow">FOUR</span></h1>
                <button class="icon-btn" id="sound-toggle" title="Toggle Sound">
                    <span class="icon" id="sound-icon">🔊</span>
                </button>
            </div>

            <!-- Scoreboard -->
            <div class="scoreboard">
                <div class="score-card human-score" id="human-card">
                    <span class="disc-preview red"></span>
                    <div class="score-info">
                        <span class="player-name">Player</span>
                        <span class="score-val" id="human-score">0</span>
                    </div>
                </div>

                <div class="score-card tie-score">
                    <div class="score-info">
                        <span class="player-name">Ties</span>
                        <span class="score-val" id="tie-score">0</span>
                    </div>
                </div>

                <div class="score-card ai-score" id="ai-card">
                    <span class="disc-preview yellow"></span>
                    <div class="score-info">
                        <span class="player-name">AI</span>
                        <span class="score-val" id="ai-score">0</span>
                    </div>
                </div>
            </div>

            <!-- Turn Status -->
            <div class="status-banner" id="status-banner">
                <div class="status-dot red" id="status-dot"></div>
                <span class="status-text" id="status-text">Your Turn</span>
            </div>
        </header>

        <!-- Game Board Area -->
        <main class="board-wrapper">
            <!-- Ghost Disc Indicator Preview Row -->
            <div class="preview-row" id="preview-row">
                <div class="preview-slot" data-col="0"><div class="ghost-disc"></div></div>
                <div class="preview-slot" data-col="1"><div class="ghost-disc"></div></div>
                <div class="preview-slot" data-col="2"><div class="ghost-disc"></div></div>
                <div class="preview-slot" data-col="3"><div class="ghost-disc"></div></div>
                <div class="preview-slot" data-col="4"><div class="ghost-disc"></div></div>
                <div class="preview-slot" data-col="5"><div class="ghost-disc"></div></div>
                <div class="preview-slot" data-col="6"><div class="ghost-disc"></div></div>
            </div>

            <div class="board" id="board">
                <!-- 6x7 Grid generated by JS -->
            </div>
        </main>

        <!-- Controls -->
        <footer class="controls">
            <button class="btn btn-secondary" id="reset-scores-btn" title="Reset Win/Loss stats">Reset Stats</button>
            <button class="btn btn-primary" id="restart-btn">New Game</button>
        </footer>
    </div>

    <!-- AI Info Box (Outside Game Box) -->
    <div class="ai-info-box">
        <div class="info-circle-badge">i</div>
        <p><strong>About the AI:</strong> Powered by the classic <strong>Minimax algorithm with Alpha-Beta Pruning</strong>, which is a simple, deterministic decision-tree search developed decades ago!</p>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon" id="modal-icon">🏆</div>
            <h2 id="modal-title">You Won!</h2>
            <p id="modal-subtitle">Brilliant moves against the Minimax AI!</p>
            <div class="modal-actions">
                <button class="btn btn-primary btn-large" id="modal-restart-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
